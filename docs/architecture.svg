  <path d="M410 330 C455 330 485 330 530 330" class="arrow"/><text x="425" y="305" class="muted s">controlled traffic</text>
  <path d="M890 315 C935 315 965 315 1010 315" class="arrow"/><text x="900" y="290" class="muted s">EVE JSON + events</text>
  <path d="M1010 455 C965 600 935 620 890 510" class="resp"/><text x="925" y="650" class="t s">Active Response: block / unblock source IP</text>

  <rect x="270" y="630" width="620" height="70" rx="14" fill="#161b22" stroke="#30363d"/>
