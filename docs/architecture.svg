<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .bg{fill:#0d1117}.box{fill:#161b22;stroke:#58a6ff;stroke-width:2}.box2{fill:#161b22;stroke:#3fb950;stroke-width:2}.box3{fill:#161b22;stroke:#d29922;stroke-width:2}.t{fill:#f0f6fc;font-family:Arial,sans-serif}.muted{fill:#8b949e;font-family:Arial,sans-serif}.h{font-size:28px;font-weight:700}.m{font-size:20px}.s{font-size:17px}.arrow{stroke:#8b949e;stroke-width:3;fill:none;marker-end:url(#a)}.resp{stroke:#f85149;stroke-width:3;fill:none;marker-end:url(#r)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker>
  </defs>
  <rect class="bg" width="1400" height="760" rx="20"/>
  <text x="70" y="70" class="t h">Wazuh SIEM Intrusion Detection &amp; Automated Response Lab</text>
  <text x="70" y="105" class="muted m">Isolated VMware NAT network — 192.168.226.0/24</text>

